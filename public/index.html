<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<script>
			(function () {
				try {
					var key = 'site_theme';
					var t = localStorage.getItem(key);
					if (
						!t &&
						window.matchMedia &&
						window.matchMedia('(prefers-color-scheme: dark)').matches
					)
						t = 'dark';
					if (!t) t = 'light';
					document.documentElement.setAttribute('data-theme', t);
				} catch (e) {}
			})();
		</script>
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1"
		/>
		<meta
			name="theme-color"
			content="#000000"
		/>
		<title>Didier Bignoux</title>
		<link
			rel="icon"
			href="/fav.svg"
			type="image/svg+xml"
		/>

			href="https://fonts.googleapis.com/css?family=Poppins:100,200,400,300,500,600,700"
			rel="stylesheet"
		/>

			href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,600,700,900"
			rel="stylesheet"
		/>

		<link
			href="https://cdnjs.cloudflare.com/ajax/libs/animations/2.1/css/animations.min.css"
			rel="stylesheet"
		/>
	</head>
